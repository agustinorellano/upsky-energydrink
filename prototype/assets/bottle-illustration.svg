<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 640" width="260" height="640">
  <defs>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a8a92"/>
      <stop offset="16%" stop-color="#e8e8ee"/>
      <stop offset="30%" stop-color="#c9c9d2"/>
      <stop offset="48%" stop-color="#f4f4f8"/>
      <stop offset="62%" stop-color="#a9a9b2"/>
      <stop offset="80%" stop-color="#d8d8e0"/>
      <stop offset="100%" stop-color="#75757e"/>
    </linearGradient>
    <linearGradient id="metalTint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec1f7a" stop-opacity="0.16"/>
      <stop offset="40%" stop-color="#ec1f7a" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#1a0010" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a3a3f"/>
      <stop offset="45%" stop-color="#121214"/>
      <stop offset="100%" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="neckShade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c7c86"/>
      <stop offset="50%" stop-color="#eceef2"/>
      <stop offset="100%" stop-color="#6c6c76"/>
    </linearGradient>
  </defs>

  <!-- sombra de piso -->
  <ellipse cx="130" cy="612" rx="76" ry="14" fill="#000" opacity="0.35"/>

  <!-- cuerpo -->
  <path d="M96 118
           C96 108 100 100 110 96
           L110 56
           C100 52 96 44 96 34
           C96 16 110 2 130 2
           C150 2 164 16 164 34
           C164 44 160 52 150 56
           L150 96
           C160 100 164 108 164 118
           L170 170
           C196 190 206 214 206 250
           L206 560
           C206 590 184 606 150 608
           L110 608
           C76 606 54 590 54 560
           L54 250
           C54 214 64 190 90 170
           Z"
        fill="url(#metal)"/>
  <path d="M96 118
           C96 108 100 100 110 96
           L110 56
           C100 52 96 44 96 34
           C96 16 110 2 130 2
           C150 2 164 16 164 34
           C164 44 160 52 150 56
           L150 96
           C160 100 164 108 164 118
           L170 170
           C196 190 206 214 206 250
           L206 560
           C206 590 184 606 150 608
           L110 608
           C76 606 54 590 54 560
           L54 250
           C54 214 64 190 90 170
           Z"
        fill="url(#metalTint)"/>

  <!-- tapa -->
  <path d="M108 2 C108 -6 114 -12 130 -12 C146 -12 152 -6 152 2 L152 40 C152 48 144 54 130 54 C116 54 108 48 108 40 Z" fill="url(#capGrad)"/>
  <g stroke="#000" stroke-opacity="0.35" stroke-width="1.4">
    <line x1="112" y1="-8" x2="112" y2="52"/>
    <line x1="121" y1="-11" x2="121" y2="53"/>
    <line x1="139" y1="-11" x2="139" y2="53"/>
    <line x1="148" y1="-8" x2="148" y2="52"/>
  </g>

  <!-- brillo lateral del vidrio -->
  <rect x="64" y="180" width="14" height="410" rx="7" fill="#fff" opacity="0.28"/>

  <!-- panel diagonal tipo rayo -->
  <path d="M118 236 L188 236 L150 308 L196 308 L108 480 L90 480 L124 372 L78 372 Z"
        fill="#0c0c0e" stroke="#ec1f7a" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- icono rayo en circulo -->
  <circle cx="130" cy="290" r="20" fill="none" stroke="#ec1f7a" stroke-width="2.5"/>
  <path d="M133 278 L121 294 L129 294 L127 304 L139 288 L131 288 Z" fill="#ec1f7a"/>

  <!-- texto marca -->
  <text x="130" y="338" text-anchor="middle" font-family="Oswald, Arial Narrow, sans-serif" font-weight="700" font-size="26" letter-spacing="0.5" fill="#ec1f7a">UP SKY</text>
  <text x="130" y="356" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-weight="500" font-size="11" letter-spacing="1" fill="#e9e6ea">energy drink</text>

  <!-- gotas de condensacion -->
  <g fill="#fff" opacity="0.5">
    <ellipse cx="80" cy="210" rx="3" ry="4"/>
    <ellipse cx="188" cy="230" rx="2.5" ry="3.5"/>
    <ellipse cx="72" cy="420" rx="3" ry="4"/>
    <ellipse cx="196" cy="440" rx="2.5" ry="3"/>
    <ellipse cx="86" cy="520" rx="2.5" ry="3.5"/>
    <ellipse cx="178" cy="540" rx="3" ry="4"/>
