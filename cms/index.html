<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel | UP SKY</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --v:#ec1f7a; --vh:#d41a6c; --vs:#FDECF4; --bg:#F6F6F8; --w:#fff; --txt:#2A2A2A; --mut:#6b736f;
  --div:#E7EAE8; --danger:#B42318; --dangerbg:#FDECEA; --r:10px; --rl:16px;
  --sh:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.07);
  --f-d:'Oswald',Impact,sans-serif; --f-u:'Manrope',system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:var(--f-u);background:var(--bg);color:var(--txt);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--v);outline-offset:2px}

/* Botones */
.primary,.secondary,.danger{border-radius:var(--r);padding:.6rem 1.1rem;font-weight:600;border:1px solid transparent}
.primary{background:var(--v);color:#fff}.primary:hover{background:var(--vh)}
.primary:disabled{opacity:.6;cursor:wait}
.secondary{background:var(--w);border-color:var(--div)}.secondary:hover{background:var(--vs)}
.danger{background:var(--danger);color:#fff}
.linklike{background:none;border:0;padding:0;color:inherit;text-decoration:underline;opacity:.85}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:1rem;background:linear-gradient(160deg,#fdecf4,#f6f6f8)}
.login-card{background:var(--w);border-radius:var(--rl);box-shadow:var(--sh);padding:2rem;width:min(400px,100%);display:grid;gap:1rem;text-align:center}
.login-logo{height:54px;margin:0 auto;object-fit:contain}
.login-card h1{font:700 1.5rem var(--f-d);margin:0;color:var(--v)}
.login-card p{margin:0;color:var(--mut)}
label{display:grid;gap:.35rem;font-weight:500;font-size:.9rem;text-align:left}
input,select,textarea{border:1px solid var(--div);border-radius:var(--r);padding:.6rem .75rem;background:var(--w);width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--v)}
.form-error{background:var(--dangerbg);color:var(--danger);padding:.55rem .75rem;border-radius:var(--r);font-size:.9rem;margin:0}

/* Shell */
.admin-shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.admin-sidebar{background:#0a0a0c;color:#fff;padding:1.25rem 1rem;display:flex;flex-direction:column;gap:1.5rem;position:sticky;top:0;height:100vh}
.admin-brand{color:#fff;text-decoration:none;font:700 1.5rem var(--f-d);display:grid}
.admin-brand small{font:500 .65rem var(--f-u);letter-spacing:.14em;opacity:.7}
#nav{display:grid;gap:.25rem}
.admin-nav{display:flex;align-items:center;gap:.6rem;background:transparent;border:0;color:#fff;padding:.65rem .75rem;border-radius:var(--r);text-align:left;opacity:.85}
.admin-nav:hover{background:rgba(255,255,255,.1)}
.admin-nav.active{background:rgba(255,255,255,.18);opacity:1;font-weight:600}
.admin-nav .n{margin-left:auto;font-size:.75rem;background:rgba(255,255,255,.18);padding:.05rem .5rem;border-radius:99px}
.sidebar-bottom{margin-top:auto;display:grid;gap:.5rem;font-size:.85rem}
.sidebar-bottom a{color:#fff}
main{padding:1.75rem clamp(1rem,3vw,2.5rem);max-width:1100px;width:100%}
.top-label{font-size:.7rem;letter-spacing:.14em;color:var(--mut);font-weight:600}
.admin-top h1{font:700 1.9rem var(--f-d);margin:.2rem 0;color:var(--v)}
.admin-top p{margin:0 0 1.25rem;color:var(--mut)}
.admin-toolbar{display:flex;flex-wrap:wrap;gap:.75rem;justify-content:space-between;align-items:center}
.admin-tabs{display:inline-flex;background:var(--w);border:1px solid var(--div);border-radius:var(--r);padding:3px}
.admin-tabs button{border:0;background:transparent;padding:.4rem .9rem;border-radius:8px;font-weight:500}
.admin-tabs button[aria-pressed=true]{background:var(--v);color:#fff}
.admin-tools{display:flex;gap:.6rem;flex-wrap:wrap}
.admin-tools input{width:220px}
.admin-count{margin:1rem 0 .6rem;color:var(--mut);font-size:.9rem}

/* Lista */
.admin-list{display:grid;gap:.65rem}
.admin-row{display:grid;grid-template-columns:112px 1fr auto;gap:1rem;align-items:center;background:var(--w);border:1px solid var(--div);border-radius:var(--rl);padding:.65rem;box-shadow:var(--sh)}
.admin-row.off{opacity:.62}
.thumb{width:112px;height:82px;border-radius:10px;background:var(--vs) center/cover no-repeat;display:grid;place-items:center;color:var(--v);font-size:1.4rem}
.meta{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--v);font-weight:600}
.admin-row h2{font:600 1.05rem var(--f-u);margin:.1rem 0}
.admin-row p{margin:0;color:var(--mut);font-size:.88rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.admin-actions{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:flex-end;align-items:center}
.admin-actions button{border:1px solid var(--div);background:var(--w);border-radius:8px;padding:.35rem .7rem;font-size:.85rem}
.admin-actions button:hover{background:var(--vs)}
.admin-actions .remove{color:var(--danger);border-color:#f1c5c0}
.admin-actions .mv{padding:.35rem .5rem}
.status{font-size:.75rem;font-weight:600;padding:.2rem .6rem;border-radius:99px;background:var(--vs);color:var(--v)}
.off .status{background:#eee;color:#666}
.empty{padding:2.5rem;text-align:center;color:var(--mut);background:var(--w);border:1px dashed var(--div);border-radius:var(--rl)}

/* Diálogos */
dialog{border:0;border-radius:var(--rl);padding:0;box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(720px,calc(100% - 1.5rem));max-height:92vh}
dialog::backdrop{background:rgba(20,30,25,.5)}
.dialog-head{display:flex;justify-content:space-between;align-items:flex-start;padding:1.25rem 1.5rem 0}
.dialog-head p{margin:0;font-size:.7rem;letter-spacing:.14em;color:var(--mut);font-weight:600}
.dialog-head h2{margin:.15rem 0 0;font:700 1.4rem var(--f-d);color:var(--v)}
.icon-button{border:0;background:transparent;font-size:1.7rem;line-height:1;padding:.1rem .5rem;border-radius:8px}
.dialog-fields{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;padding:1.1rem 1.5rem}
.dialog-fields .full{grid-column:1/-1}
.dialog-fields small{color:var(--mut);font-weight:400}
.toggle-row{display:flex;align-items:center;gap:.6rem}
.toggle-row input{width:auto}
#form-error{margin:0 1.5rem}
.dialog-actions{display:flex;justify-content:flex-end;gap:.6rem;padding:1rem 1.5rem 1.25rem}
.confirm-body{padding:1.5rem}
.confirm-body h2{margin:0 0 .5rem;font:700 1.3rem var(--f-d)}
.confirm-body p{color:var(--mut);margin:.3rem 0}

/* Imagen */
.img-field{display:grid;grid-template-columns:84px 1fr;gap:.75rem;align-items:start}
.img-field .thumb{width:84px;height:64px}
.img-ctrl{display:grid;gap:.4rem}
.img-btns{display:flex;gap:.4rem;flex-wrap:wrap}
.img-btns button,.img-btns label.file{border:1px solid var(--div);background:var(--w);border-radius:8px;padding:.3rem .7rem;font-size:.82rem;font-weight:500;cursor:pointer;width:auto}
.img-btns input[type=file]{display:none}

.toast{position:fixed;bottom:1.25rem;left:50%;transform:translateX(-50%);background:var(--v);color:#fff;padding:.7rem 1.2rem;border-radius:99px;box-shadow:var(--sh);z-index:50}
.toast.err{background:var(--danger)}

@media (max-width:820px){
  .admin-shell{grid-template-columns:1fr}
  .admin-sidebar{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:.75rem}
  #nav{display:flex;flex-wrap:wrap;order:3;width:100%}
  .sidebar-bottom{margin:0 0 0 auto;display:flex;gap:1rem}
  .admin-row{grid-template-columns:84px 1fr}
  .admin-actions{grid-column:1/-1;justify-content:flex-start}
  .thumb{width:84px;height:64px}
  .dialog-fields{grid-template-columns:1fr}
  .admin-tools,.admin-tools input{width:100%}
}

</style>
</head>
<body>

<!-- Login -->
<section id="login" class="login" hidden>
  <form id="login-form" class="login-card">
    <img src="logo.png" alt="UP SKY" class="login-logo">
    <h1>Panel de administración</h1>
    <p>Ingresá la contraseña para editar el contenido del sitio.</p>
    <label>Contraseña
      <input type="password" id="login-pass" autocomplete="current-password" required autofocus>
    </label>
    <p class="form-error" id="login-error" role="alert" hidden></p>
    <button class="primary" type="submit">Ingresar</button>
  </form>
</section>

<!-- Panel -->
<div id="app" class="admin-shell" hidden>
  <aside class="admin-sidebar">
    <a class="admin-brand" data-site href="#">UP SKY <small>ADMINISTRACIÓN</small></a>
    <nav id="nav" aria-label="Secciones"></nav>
    <div class="sidebar-bottom">
      <a data-site href="#" target="_blank" rel="noopener">Ver sitio ↗</a>
      <button type="button" id="logout" class="linklike">Cerrar sesión</button>
    </div>
  </aside>

  <main>
    <header class="admin-top">
      <div>
        <span class="top-label">PANEL DE ADMINISTRACIÓN</span>
        <h1 id="view-title"></h1>
        <p id="view-desc"></p>
      </div>
    </header>

    <div class="admin-toolbar">
      <div class="admin-tabs" role="group" aria-label="Estado">
        <button data-filter="todos" aria-pressed="true">Todos</button>
        <button data-filter="visibles" aria-pressed="false">Visibles</button>
        <button data-filter="ocultos" aria-pressed="false">Ocultos</button>
      </div>
      <div class="admin-tools">
        <input type="search" id="search" placeholder="Buscar..." aria-label="Buscar">
        <button class="primary" id="new-item">+ Agregar</button>
      </div>
    </div>
    <div class="admin-count" id="count" role="status"></div>
    <div id="list" class="admin-list"></div>
  </main>
</div>

<!-- Formulario -->
<dialog id="item-dialog">
  <form id="item-form">
    <div class="dialog-head">
      <div><p>UP SKY</p><h2 id="dialog-title"></h2></div>
      <button type="button" class="icon-button" id="close-dialog" aria-label="Cerrar">×</button>
    </div>
    <div class="dialog-fields" id="fields"></div>
    <p class="form-error" id="form-error" role="alert" hidden></p>
    <div class="dialog-actions">
      <button type="button" class="secondary" id="cancel-dialog">Cancelar</button>
      <button type="submit" class="primary" id="save-btn">Guardar</button>
    </div>
  </form>
</dialog>

<!-- Confirmar eliminación -->
<dialog id="delete-dialog">
  <div class="confirm-body">
    <h2>¿Eliminar este elemento?</h2>
    <p id="delete-name"></p>
    <p>Se borra de la web y no se puede deshacer. Si solo querés sacarlo un tiempo, usá <strong>Ocultar</strong>.</p>
    <div class="dialog-actions">
      <button type="button" class="secondary" id="cancel-delete">Cancelar</button>
      <button type="button" class="danger" id="confirm-delete">Eliminar</button>
    </div>
  </div>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script>
// UP SKY · Panel de administración (CMS)
(() => {
  const CFG = window.UPSKY_SUPABASE || {};
  const configured = CFG.url && !CFG.url.includes('PEGAR') && CFG.anonKey && !CFG.anonKey.includes('PEGAR');

  // ── Definición de secciones y campos ────────────────────────────────────────
  const IMGS = n => Array.from({ length: n }, (_, i) => ({ key: `imagen_${i + 1}`, label: n === 1 ? 'Imagen' : `Imagen ${i + 1}`, type: 'image', full: true }));
  const SI_NO = { type: 'select', options: ['NO', 'SI'], default: 'NO' };

  const SECTIONS = {
    productos: {
      label: 'Catálogo', icon: '▦', desc: 'Productos para consumidor final. Se ven en el Catálogo y en los destacados del Inicio.',
      title: i => i.nombre, meta: i => i.tipo, sub: i => [i.presentacion, price(i)].filter(Boolean).join(' · '),
      fields: [
        { key: 'nombre', label: 'Nombre', required: true, max: 80, full: true },
        { key: 'presentacion', label: 'Presentación', placeholder: '6 botellas 355cc c/u', max: 80 },
        { key: 'tipo', label: 'Tipo', type: 'select', options: ['Pack', 'Vaso', 'Remera', 'Otro'] },
        { key: 'precio', label: 'Precio (pesos, sin envío)', type: 'number', required: true },
        { key: 'max_por_pedido', label: 'Máximo por pedido', type: 'number', hint: 'Dejar vacío si no hay tope' },
        { key: 'desc_desde_5', label: 'Descuento desde 5 unidades (%)', type: 'number' },
        { key: 'desc_desde_10', label: 'Descuento desde 10 unidades (%)', type: 'number' },
        { key: 'etiqueta', label: 'Etiqueta', placeholder: 'Más elegido', max: 30 },
        { key: 'colores', label: 'Colores disponibles', placeholder: 'Negro, Rosa', hint: 'Separar con comas' },
        { key: 'destacado', label: 'Destacado en el Inicio', ...SI_NO },
        { key: 'descripcion', label: 'Descripción', type: 'textarea', full: true, max: 400 },
        ...IMGS(4),
      ],
    },
    mayorista: {
      label: 'Para negocios · Precios', icon: '▲', desc: 'Packs por mayor y pallet que se compran desde "Para negocios".',
      title: i => i.nombre, meta: () => 'Por mayor', sub: i => [i.presentacion, price(i)].filter(Boolean).join(' · '),
      fields: [
        { key: 'nombre', label: 'Nombre', required: true, max: 80, full: true },
        { key: 'presentacion', label: 'Presentación', placeholder: '6 botellas 355cc c/u' },
        { key: 'unidades', label: 'Cantidad de packs', type: 'number' },
        { key: 'precio', label: 'Precio total (pesos, sin envío)', type: 'number', required: true },
        { key: 'nota', label: 'Nota', placeholder: 'Consultar precio por volumen', full: true, max: 160 },
        ...IMGS(1),
      ],
    },
    pasos_negocios: {
      label: 'Para negocios · Cómo funciona', icon: '①', desc: 'Los pasos de "Comprar es simple". Se ordenan con las flechas.',
      title: i => i.titulo, meta: () => 'Paso', sub: i => i.texto,
      fields: [
        { key: 'titulo', label: 'Título', required: true, max: 60, full: true },
        { key: 'texto', label: 'Texto', type: 'textarea', full: true, max: 200 },
      ],
    },
    eventos: {
      label: 'Eventos', icon: '★', desc: 'Eventos de la agenda. "Visible" = publicado. El próximo se muestra solo en el banner.',
      title: i => i.nombre, meta: i => i.categoria, sub: i => [i.fecha, i.hora, i.lugar].filter(Boolean).join(' · '),
      fields: [
        { key: 'nombre', label: 'Nombre', required: true, max: 80, full: true },
        { key: 'categoria', label: 'Categoría', type: 'select', options: ['Noche', 'Deporte', 'Playa', 'Comercio', 'Comunidad'], hint: 'Se usa para los filtros de la web' },
        { key: 'lugar', label: 'Lugar', max: 80 },
        { key: 'fecha', label: 'Fecha', type: 'date' },
        { key: 'hora', label: 'Hora', placeholder: '21:00' },
        { key: 'etiquetas', label: 'Etiquetas', placeholder: 'Degustación, Música', hint: 'Separar con comas' },
        { key: 'descripcion', label: 'Descripción', type: 'textarea', full: true, max: 500 },
        ...IMGS(1),
      ],
    },
  };

  function price(i) { return i.precio ? `$${Number(i.precio).toLocaleString('es-AR')}` : ''; }

  // ── Utilidades ──────────────────────────────────────────────────────────────
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const tkey = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

  function imgUrl(u) {
    if (!u) return '';
    const m = u.match(/\/file\/d\/([\w-]+)/) || u.match(/[?&]id=([\w-]+)/) || u.match(/\/d\/([\w-]+)/);
    return m ? `https://drive.google.com/thumbnail?id=${m[1]}&sz=w400` : u;
  }

  let toastTimer;
  function toast(msg, err) {
    const t = $('#toast');
    t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), err ? 5000 : 2200);
  }

  // ── Estado ──────────────────────────────────────────────────────────────────
  let sb, current = 'productos', filter = 'todos', query = '', editing = null, deleting = null;
  const cache = {};            // section → items[]
  const counts = {};

  // ── Arranque / login ────────────────────────────────────────────────────────
  async function init() {
    document.querySelectorAll('[data-site]').forEach(a => (a.href = CFG.siteUrl || '/'));
    if (!configured) {
      $('#login').hidden = false;
      $('#login-form').innerHTML = '<h1>Falta configurar</h1><p>Completá <code>supabase-config.js</code> con la URL y la clave de Supabase. Los pasos están en <code>CONFIGURACION-SUPABASE.md</code>.</p>';
      return;
    }
    sb = supabase.createClient(CFG.url, CFG.anonKey);
    const { data } = await sb.auth.getSession();
    data.session ? showApp() : showLogin();
  }

  function showLogin() { $('#app').hidden = true; $('#login').hidden = false; $('#login-pass').focus(); }

  async function showApp() {
    $('#login').hidden = true; $('#app').hidden = false;
    buildNav();
    await Promise.all(Object.keys(SECTIONS).map(load));
    buildNav(); render();
  }

  $('#login-form').addEventListener('submit', async e => {
    e.preventDefault();
    if (!sb) return;
    const err = $('#login-error'); err.hidden = true;
    const { error } = await sb.auth.signInWithPassword({ email: CFG.adminEmail, password: $('#login-pass').value });
    if (error) { err.textContent = 'Contraseña incorrecta.'; err.hidden = false; return; }
    $('#login-pass').value = '';
    showApp();
  });

  $('#logout').addEventListener('click', async () => { await sb.auth.signOut(); showLogin(); });

  // ── Datos ───────────────────────────────────────────────────────────────────
  async function load(section) {
    const { data, error } = await sb.from('items').select('*').eq('section', section).order('position').order('created_at');
    if (error) { toast('No se pudo cargar: ' + error.message, true); return; }
    cache[section] = data; counts[section] = data.length;
  }

  // ── Navegación y lista ──────────────────────────────────────────────────────
  function buildNav() {
    $('#nav').innerHTML = Object.entries(SECTIONS).map(([k, s]) =>
      `<button class="admin-nav${k === current ? ' active' : ''}" data-view="${k}" ${k === current ? 'aria-current="page"' : ''}>
         <span aria-hidden="true">${s.icon}</span> ${esc(s.label)}<span class="n">${counts[k] ?? ''}</span></button>`).join('');
  }

  $('#nav').addEventListener('click', e => {
    const b = e.target.closest('[data-view]'); if (!b) return;
    current = b.dataset.view; filter = 'todos'; query = ''; $('#search').value = '';
    document.querySelectorAll('[data-filter]').forEach(x => x.setAttribute('aria-pressed', x.dataset.filter === 'todos'));
    buildNav(); render();
  });

  document.querySelectorAll('[data-filter]').forEach(b => b.addEventListener('click', () => {
    filter = b.dataset.filter;
    document.querySelectorAll('[data-filter]').forEach(x => x.setAttribute('aria-pressed', x === b));
    render();
  }));
  $('#search').addEventListener('input', e => { query = tkey(e.target.value); render(); });

  function render() {
    const S = SECTIONS[current];
    $('#view-title').textContent = S.label;
    $('#view-desc').textContent = S.desc;
    $('#new-item').textContent = '+ Agregar';
    const all = cache[current] || [];
    const items = all.filter(it =>
      (filter === 'todos' || (filter === 'visibles') === it.active) &&
      (!query || tkey(Object.values(it.data).join(' ')).includes(query)));
    $('#count').textContent = `${items.length} ${items.length === 1 ? 'elemento' : 'elementos'} en esta vista`;

    $('#list').innerHTML = items.length ? items.map(it => {
      const d = it.data, img = imgUrl(d.imagen_1);
      const canMove = filter === 'todos' && !query;
      const idx = all.indexOf(it);
      return `<article class="admin-row${it.active ? '' : ' off'}">
        <div class="thumb" ${img ? `style="background-image:url('${esc(img)}')"` : ''}>${img ? '' : S.icon}</div>
        <div><span class="meta">${esc(S.meta(d) || '')}</span><h2>${esc(S.title(d) || '(sin nombre)')}</h2><p>${esc(S.sub(d) || '')}</p></div>
        <div class="admin-actions">
          <span class="status">${it.active ? 'Visible' : 'Oculto'}</span>
          ${canMove ? `<button class="mv" data-a="up" data-id="${it.id}" aria-label="Subir" ${idx === 0 ? 'disabled' : ''}>↑</button>
          <button class="mv" data-a="down" data-id="${it.id}" aria-label="Bajar" ${idx === all.length - 1 ? 'disabled' : ''}>↓</button>` : ''}
          <button data-a="toggle" data-id="${it.id}">${it.active ? 'Ocultar' : 'Mostrar'}</button>
          <button data-a="edit" data-id="${it.id}">Editar</button>
          <button class="remove" data-a="delete" data-id="${it.id}">Eliminar</button>
        </div></article>`;
    }).join('') : `<div class="empty">${all.length ? 'No hay resultados con ese filtro.' : 'Todavía no hay nada acá. Usá “+ Agregar” para crear el primero.'}</div>`;
  }

  $('#list').addEventListener('click', async e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const all = cache[current], it = all.find(x => x.id === b.dataset.id); if (!it) return;
    const a = b.dataset.a;
    if (a === 'edit') return openForm(it);
    if (a === 'delete') { deleting = it; $('#delete-name').textContent = SECTIONS[current].title(it.data) || ''; return $('#delete-dialog').showModal(); }
    if (a === 'toggle') {
      const { error } = await sb.from('items').update({ active: !it.active }).eq('id', it.id);
      if (error) return toast(error.message, true);
      it.active = !it.active; render(); return toast(it.active ? 'Ahora es visible en la web' : 'Ocultado de la web');
    }
    if (a === 'up' || a === 'down') return move(it, a === 'up' ? -1 : 1);
  });

  async function move(it, dir) {
    const all = cache[current], i = all.indexOf(it), j = i + dir;
    if (j < 0 || j >= all.length) return;
    [all[i], all[j]] = [all[j], all[i]];
    // Renumera todo para evitar posiciones repetidas
    const updates = all.map((x, n) => ({ id: x.id, section: x.section, data: x.data, active: x.active, position: n }));
    all.forEach((x, n) => (x.position = n));
    render();
    const { error } = await sb.from('items').upsert(updates);
    if (error) { toast(error.message, true); await load(current); render(); }
  }

  $('#confirm-delete').addEventListener('click', async () => {
    if (!deleting) return;
    const { error } = await sb.from('items').delete().eq('id', deleting.id);
    $('#delete-dialog').close();
    if (error) return toast(error.message, true);
    cache[current] = cache[current].filter(x => x.id !== deleting.id); counts[current]--; deleting = null;
    buildNav(); render(); toast('Eliminado');
  });
  $('#cancel-delete').addEventListener('click', () => $('#delete-dialog').close());

  // ── Formulario ──────────────────────────────────────────────────────────────
  $('#new-item').addEventListener('click', () => openForm(null));
  $('#close-dialog').addEventListener('click', () => $('#item-dialog').close());
  $('#cancel-dialog').addEventListener('click', () => $('#item-dialog').close());

  function fieldHtml(f, v) {
    const id = `f-${f.key}`, val = v ?? f.default ?? '', cls = f.full ? ' class="full"' : '';
    const hint = f.hint ? `<small>${esc(f.hint)}</small>` : '';
    if (f.type === 'image') {
      return `<div class="full"><label for="${id}">${esc(f.label)}</label>
        <div class="img-field" data-img="${f.key}">
          <div class="thumb" style="${val ? `background-image:url('${esc(imgUrl(val))}')` : ''}"></div>
          <div class="img-ctrl">
            <input id="${id}" name="${f.key}" value="${esc(val)}" placeholder="Pegá una URL o subí un archivo">
            <div class="img-btns">
              <label class="file">Subir imagen<input type="file" accept="image/*" data-up="${f.key}"></label>
              <button type="button" data-clear="${f.key}">Quitar</button>
            </div></div></div></div>`;
    }
    if (f.type === 'textarea') return `<label${cls}>${esc(f.label)}<textarea name="${f.key}" rows="3" ${f.max ? `maxlength="${f.max}"` : ''}>${esc(val)}</textarea></label>`;
    if (f.type === 'select') {
      const opts = f.options.map(o => { const [ov, ol] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(ov)}"${String(val) === String(ov) ? ' selected' : ''}>${esc(ol)}</option>`; }).join('');
      return `<label${cls}>${esc(f.label)}<select name="${f.key}"><option value="">—</option>${opts}</select></label>`;
    }
    const type = f.type === 'number' ? 'number' : f.type === 'date' ? 'date' : 'text';
    const list = f.list ? ` list="dl-${f.key}"` : '';
    const dl = f.list ? `<datalist id="dl-${f.key}">${f.list.map(o => `<option value="${esc(o)}">`).join('')}</datalist>` : '';
    return `<label${cls}>${esc(f.label)}<input name="${f.key}" type="${type}" ${type === 'number' ? 'step="any" min="0"' : ''} value="${esc(val)}"
      ${f.required ? 'required' : ''} ${f.max ? `maxlength="${f.max}"` : ''} ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ''}${list}>${hint}${dl}</label>`;
  }

  function openForm(it) {
    editing = it;
    const S = SECTIONS[current], d = it ? it.data : {};
    $('#dialog-title').textContent = it ? `Editar ${S.label.toLowerCase()}` : `Agregar a ${S.label.toLowerCase()}`;
    $('#fields').innerHTML = S.fields.map(f => fieldHtml(f, d[f.key])).join('') +
      `<label class="toggle-row full"><input type="checkbox" name="__active" ${(it ? it.active : true) ? 'checked' : ''}><span>Mostrar en la web</span></label>`;
    $('#form-error').hidden = true;
    $('#item-dialog').showModal();
  }

  // Vista previa al editar la URL
  $('#fields').addEventListener('input', e => {
    const wrap = e.target.closest('[data-img]'); if (!wrap || e.target.type === 'file') return;
    wrap.querySelector('.thumb').style.backgroundImage = e.target.value ? `url('${imgUrl(e.target.value)}')` : '';
  });
  $('#fields').addEventListener('click', e => {
    const c = e.target.closest('[data-clear]'); if (!c) return;
    const inp = $(`#f-${c.dataset.clear}`); inp.value = ''; inp.dispatchEvent(new Event('input', { bubbles: true }));
  });
  $('#fields').addEventListener('change', async e => {
    const key = e.target.dataset?.up; if (!key || !e.target.files[0]) return;
    const lab = e.target.closest('label'); const prev = lab.firstChild.textContent;
    lab.firstChild.textContent = 'Subiendo…';
    try {
      const blob = await shrink(e.target.files[0]);
      const path = `${current}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.jpg`;
      const { error } = await sb.storage.from(CFG.bucket || 'upsky-images').upload(path, blob, { contentType: 'image/jpeg', cacheControl: '31536000' });
      if (error) throw error;
      const { data } = sb.storage.from(CFG.bucket || 'upsky-images').getPublicUrl(path);
      const inp = $(`#f-${key}`); inp.value = data.publicUrl; inp.dispatchEvent(new Event('input', { bubbles: true }));
    } catch (err) { toast('No se pudo subir la imagen: ' + (err.message || err), true); }
    lab.firstChild.textContent = prev; e.target.value = '';
  });

  // Reduce la imagen a 1600px máx. y la comprime (JPEG 85%) antes de subirla
  function shrink(file) {
    return new Promise((res, rej) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const k = Math.min(1, 1600 / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(b => (b ? res(b) : rej(new Error('Imagen no válida'))), 'image/jpeg', 0.85);
      };
      img.onerror = () => rej(new Error('No se pudo leer la imagen'));
      img.src = url;
    });
  }

  $('#item-form').addEventListener('submit', async e => {
    e.preventDefault();
    const S = SECTIONS[current], fd = new FormData(e.target), data = {};
    S.fields.forEach(f => {
      let v = (fd.get(f.key) ?? '').toString().trim();
      if (v === '') return;
      data[f.key] = f.type === 'number' ? Number(v) : v;
    });
    const active = fd.get('__active') === 'on';
    const btn = $('#save-btn'); btn.disabled = true;
    let error;
    if (editing) {
      ({ error } = await sb.from('items').update({ data, active }).eq('id', editing.id));
    } else {
      const pos = (cache[current] || []).reduce((m, x) => Math.max(m, x.position), -1) + 1;
      ({ error } = await sb.from('items').insert({ section: current, data, active, position: pos }));
    }
    btn.disabled = false;
    if (error) { const el = $('#form-error'); el.textContent = 'No se pudo guardar: ' + error.message; el.hidden = false; return; }
    $('#item-dialog').close();
    await load(current); buildNav(); render();
    toast('Guardado · ya se ve en la web');
  });

  init();
})();

</script>
</body>
</html>
